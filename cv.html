<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Curriculum vitae of Your Name." />
    <title>CV template · ZhaoxuLiu</title>
    <link rel="stylesheet" href="styles.css?v=20260927-2" />
    <script src="profile.js" defer></script>
    <script src="profile-render.js?v=20260927-2" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <noscript><p class="data-error">Please enable JavaScript to view the CV.</p></noscript>
    <p class="data-error" data-load-error hidden>Profile could not be loaded. Please check profile.js and refresh.</p>
    <main class="cv-page">
      <div class="cv-topline cv-actions">
        <a class="button button-quiet" href="index.html">← Back to homepage</a>
        <button class="button button-primary" type="button" onclick="window.print()">Print / Save PDF</button>
      </div>

      <article class="cv-sheet" data-cv></article>
    </main>
    <div class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
